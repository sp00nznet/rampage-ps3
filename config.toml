# Rampage World Tour (NPUB30003) — ps3recomp configuration
#
# Used by: python tools/recompile.py --config config.toml
# Modeled on simpsons/config.toml. This EBOOT is Digital Eclipse / Backbone's
# "emutech" Midway arcade emulator (source/emutech/ZYTWunit/), the same shape as
# the Simpsons Arcade port: we recompile the emulator, the arcade ROM in rwt.sr
# is interpreted by it.

[input]
elf_path = "game/EBOOT.elf"     # produced by decrypting USRDIR/EBOOT.BIN
sfo_path = "extracted/PARAM.SFO"

[output]
output_dir = "src/recomp/"
func_prefix = "recomp_"
generate_func_table = true

[modules]
# 155 imports across 13 libraries, parsed from the EBOOT lib.stub tables
# (analysis/EBOOT.imports.json). Small surface — no cellSail, no cellAtrac, no
# cellFont. "hle" = ps3recomp host implementation.
cellGcmSys    = "hle"   # 14 — RSX: emulator framebuffer -> GPU
cellAudio     = "hle"   #  8 — MultiStream mixer output -> PCM out
sys_io        = "hle"   # 17 — cellPad / cellKb input
sys_fs        = "hle"   #  8 — loads rwt.sr and the FE_/PS3_IMAGES trees
cellSysutil   = "hle"   # 19 — system params, video out, callbacks
cellSysmodule = "hle"   #  2 — module load/unload
sysPrxForUser = "hle"   # 13 — TLS, lwmutex, threads, process exit
cellRtc       = "hle"   #  2 — clock
cellSpurs     = "hle"   #  7 — SPU task mgmt (MultiStream audio)
cellKey2char  = "hle"   #  4 — text entry for the leaderboard name field
# --- online / PSN: stub for offline single-machine play ---
sceNp         = "stub"  # 40 — NP scoreboards (sceNpScore*), matching GUI
sys_net       = "stub"  # 15
cellNetCtl    = "stub"  #  6

[memory]
main_ram_mb = 256
vram_mb = 256
thread_stack_kb = 1024

[threading]
max_ppu_threads = 64
max_spu_threads = 6
use_host_threads = true

[graphics]
backend = "d3d12"
width = 1280
height = 720
vsync = "on"
scale_factor = 1

[audio]
backend = "wasapi"
sample_rate = 48000
buffer_size = 512

[debug]
log_hle_calls = true
log_missing_nids = true
break_on_unimplemented = false
dump_disassembly = false
breakpoint_address = 0
